name: Setup Nix
description: Install Nix and optionally configure Cachix
inputs:
  cachix-cache:
    description: Cachix cache name
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - name: Setup Cachix
      if: ${{ inputs.cachix-cache != '' }}
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: ${{ inputs.cachix-cache }}
