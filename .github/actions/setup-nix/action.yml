name: Setup Nix
description: Generate GitHub App token for frablab-config, install Nix, and optionally configure Cachix
inputs:
  app-client-id:
    description: GitHub App Client ID
    required: true
  app-private-key:
    description: GitHub App Private Key
    required: true
  cachix-cache:
    description: Cachix cache name
    required: false
    default: ""
outputs:
  token:
    description: GitHub App Token for frablab-config
    value: ${{ steps.generate-token-frablab-config.outputs.token }}
runs:
  using: composite
  steps:
    - name: Generate GitHub App Token for frablab-config
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      id: generate-token-frablab-config
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        repositories: "frablab-config"
        permission-contents: "read"
        permission-metadata: "read"
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ steps.generate-token-frablab-config.outputs.token }}
    - name: Setup Cachix
      if: ${{ inputs.cachix-cache != '' }}
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: ${{ inputs.cachix-cache }}
