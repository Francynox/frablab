name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          app-client-id: ${{ vars.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          cachix-cache: francynox

      - name: Run flake check
        run: nix flake check --print-build-logs

  list-hosts:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.set-matrix.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          app-client-id: ${{ vars.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Discover NixOS configurations
        id: set-matrix
        run: |
          set -euo pipefail
          HOSTS_JSON=$(nix flake show --json . | jq -c '[.nixosConfigurations | keys[]]')
          echo "Found hosts: $HOSTS_JSON"
          echo "hosts=$HOSTS_JSON" >> "$GITHUB_OUTPUT"

  build-hosts:
    runs-on: ubuntu-latest
    needs: [flake-check, list-hosts]
    if: needs.list-hosts.outputs.hosts != '' && needs.list-hosts.outputs.hosts != '[]'
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.list-hosts.outputs.hosts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          app-client-id: ${{ vars.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          cachix-cache: francynox

      - name: Build ${{ matrix.host }}
        env:
          HOST: ${{ matrix.host }}
        run: nix build .#nixosConfigurations."$HOST".config.system.build.toplevel --print-build-logs

  ci-success:
    name: "CI Success"
    runs-on: ubuntu-latest
    needs: [flake-check, list-hosts, build-hosts]
    if: always()
    steps:
      - name: Alls Green
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: build-hosts
